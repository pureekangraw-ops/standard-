name: GO Hub Drive Live Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/go-hub-drive-live-smoke.yml"

permissions:
  contents: read

jobs:
  live-drive-smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOHUB_MASTER_KEY: ${{ secrets.GOHUB_MASTER_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run governed Drive create rename move readback
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createTestAccessToken } from "./go-hub-oauth.mjs";

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const cloudflareToken = process.env.CLOUDFLARE_API_TOKEN;
          const signingKey = process.env.GOHUB_MASTER_KEY;
          const runId = process.env.GITHUB_RUN_ID;
          const goHubFolderId = "1Frd9yAdiMwf-b4U-e6cJ2eZGRz41zQGN";
          const migrationMapId = "1ej2IzADhrGJ6dgun9Py3FLjMYRDEGlgH";
          const migrationMapName = "DRIVE_ORGANIZATION_MIGRATION_MAP_2026-09-19.md";
          const initialFolderName = "GO-HUB-DRIVE-SMOKE-" + runId;
          const finalFolderName = "GO-HUB-DRIVE-SMOKE-VERIFIED-" + runId;

          if (!accountId || !cloudflareToken || !signingKey || !runId) {
            throw new Error("LIVE_SMOKE_PREREQUISITES_MISSING");
          }

          const subdomainResponse = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" + accountId + "/workers/subdomain",
            { headers: { authorization: "Bearer " + cloudflareToken } },
          );
          const subdomainPayload = await subdomainResponse.json().catch(() => null);
          const subdomain = String(subdomainPayload?.result?.subdomain || "").trim();
          if (!subdomainResponse.ok || !subdomain) throw new Error("WORKERS_SUBDOMAIN_UNAVAILABLE");

          const origin = "https://go-hub." + subdomain + ".workers.dev";
          const token = await createTestAccessToken({ issuer: origin, signingKey });
          const workContext = {
            workId: "WORK-DRIVE-HUB-20260919-001",
            checkpointId: "CP-DRIVE-HUB-001",
            returnAddress: "CP-DRIVE-HUB-001",
            destination: "destination://drive",
            task: "Live Drive smoke inside GO-HUB scope",
            requestedResult: "Create rename move readback PASS with migration map restored",
            lensReference: "role://drive-hub-integration@WORK-DRIVE-HUB-20260919-001",
          };

          async function call(name, args = {}) {
            const response = await fetch(origin + "/mcp", {
              method: "POST",
              headers: {
                authorization: "Bearer " + token,
                "content-type": "application/json",
                accept: "application/json, text/event-stream",
              },
              body: JSON.stringify({
                jsonrpc: "2.0",
                id: name,
                method: "tools/call",
                params: { name, arguments: args },
              }),
            });
            const payload = await response.json().catch(() => null);
            const result = payload?.result;
            const proof = result?.structuredContent;
            if (!response.ok || payload?.error || result?.isError) {
              const code = proof?.code || payload?.error?.message || (name + "_FAILED");
              const category = proof?.category ? ":" + proof.category : "";
              const field = proof?.field ? ":" + proof.field : "";
              throw new Error(name + ":" + code + category + field);
            }
            return proof;
          }

          let evidenceFolderId = null;
          let migrationMoved = false;

          try {
            const capabilities = await call("go_hub_drive_capabilities");
            if (capabilities?.configured !== true) throw new Error("DRIVE_NOT_CONFIGURED");

            const goHub = await call("go_hub_drive_get_item", { fileId: goHubFolderId });
            if (goHub?.item?.id !== goHubFolderId) throw new Error("GO_HUB_FOLDER_READBACK_FAILED");

            const before = await call("go_hub_drive_get_item", { fileId: migrationMapId });
            if (before?.item?.name !== migrationMapName ||
                !before?.item?.parents?.includes(goHubFolderId)) {
              throw new Error("MIGRATION_MAP_PRECONDITION_FAILED");
            }

            const created = await call("go_hub_drive_create_folder", {
              parentId: goHubFolderId,
              name: initialFolderName,
              workContext,
            });
            if (created?.readback !== "PASS" || !created?.item?.id) {
              throw new Error("CREATE_READBACK_FAILED");
            }
            evidenceFolderId = created.item.id;

            const renamed = await call("go_hub_drive_rename_item", {
              fileId: evidenceFolderId,
              name: finalFolderName,
              workContext,
            });
            if (renamed?.readback !== "PASS" || renamed?.item?.name !== finalFolderName) {
              throw new Error("RENAME_READBACK_FAILED");
            }

            const movedIn = await call("go_hub_drive_move_item", {
              fileId: migrationMapId,
              destinationFolderId: evidenceFolderId,
              workContext,
            });
            if (movedIn?.readback !== "PASS" ||
                !movedIn?.item?.parents?.includes(evidenceFolderId)) {
              throw new Error("MOVE_IN_READBACK_FAILED");
            }
            migrationMoved = true;

            const inside = await call("go_hub_drive_get_item", { fileId: migrationMapId });
            if (!inside?.item?.parents?.includes(evidenceFolderId)) {
              throw new Error("MOVE_IN_ITEM_READBACK_FAILED");
            }

            const movedBack = await call("go_hub_drive_move_item", {
              fileId: migrationMapId,
              destinationFolderId: goHubFolderId,
              workContext,
            });
            if (movedBack?.readback !== "PASS" ||
                !movedBack?.item?.parents?.includes(goHubFolderId)) {
              throw new Error("MOVE_BACK_READBACK_FAILED");
            }
            migrationMoved = false;

            const finalMap = await call("go_hub_drive_get_item", { fileId: migrationMapId });
            if (finalMap?.item?.name !== migrationMapName ||
                !finalMap?.item?.parents?.includes(goHubFolderId)) {
              throw new Error("FINAL_MIGRATION_MAP_READBACK_FAILED");
            }

            const children = await call("go_hub_drive_list_children", {
              parentId: goHubFolderId,
              pageSize: 1000,
            });
            const folderFound = children?.items?.some(item =>
              item.id === evidenceFolderId && item.name === finalFolderName
            );
            const mapFound = children?.items?.some(item =>
              item.id === migrationMapId && item.name === migrationMapName
            );
            if (!folderFound || !mapFound) throw new Error("FINAL_LIST_READBACK_FAILED");

            console.log("GO_HUB_DRIVE_LIVE_SMOKE_PASS");
            console.log("evidence_folder_id=" + evidenceFolderId);
            console.log("evidence_folder_name=" + finalFolderName);
            console.log("migration_map_restored=true");
          } catch (error) {
            if (migrationMoved) {
              try {
                await call("go_hub_drive_move_item", {
                  fileId: migrationMapId,
                  destinationFolderId: goHubFolderId,
                  workContext,
                });
                migrationMoved = false;
              } catch {}
            }
            if (evidenceFolderId) {
              try {
                await call("go_hub_drive_rename_item", {
                  fileId: evidenceFolderId,
                  name: "GO-HUB-DRIVE-SMOKE-RECOVERY-" + runId,
                  workContext,
                });
              } catch {}
            }
            throw error;
          }
          NODE
