name: GO Hub Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOHUB_GITHUB_TOKEN: ${{ secrets.GOHUB_GITHUB_TOKEN }}
      GOHUB_OAUTH_SIGNING_KEY: ${{ secrets.GOHUB_OAUTH_SIGNING_KEY }}
      GOHUB_OWNER_PASSCODE_HASH: ${{ secrets.GOHUB_OWNER_PASSCODE_HASH }}
      GOHUB_OAUTH_CLIENT_ID: ${{ secrets.GOHUB_OAUTH_CLIENT_ID }}
      GOHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GOHUB_OAUTH_CLIENT_SECRET }}
      GOHUB_OAUTH_REDIRECT_URI: ${{ secrets.GOHUB_OAUTH_REDIRECT_URI }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify GO Hub safety gate
        run: npm run deploy:gate

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy GO Hub Worker
        shell: bash
        run: |
          secrets_file="${RUNNER_TEMP}/go-hub.secrets"
          : > "${secrets_file}"
          chmod 600 "${secrets_file}"
          if [ -n "${GOHUB_GITHUB_TOKEN}" ]; then
            printf 'GITHUB_TOKEN=%s\\n' "${GOHUB_GITHUB_TOKEN}" >> "${secrets_file}"
          fi
          if [ -n "${GOHUB_OAUTH_SIGNING_KEY}" ] && [ -n "${GOHUB_OWNER_PASSCODE_HASH}" ] && [ -n "${GOHUB_OAUTH_CLIENT_ID}" ] && [ -n "${GOHUB_OAUTH_CLIENT_SECRET}" ] && [ -n "${GOHUB_OAUTH_REDIRECT_URI}" ]; then
            printf 'GOHUB_OAUTH_SIGNING_KEY=%s\\n' "${GOHUB_OAUTH_SIGNING_KEY}" >> "${secrets_file}"
            printf 'GOHUB_OWNER_PASSCODE_HASH=%s\\n' "${GOHUB_OWNER_PASSCODE_HASH}" >> "${secrets_file}"
            printf 'GOHUB_OAUTH_CLIENT_ID=%s\\n' "${GOHUB_OAUTH_CLIENT_ID}" >> "${secrets_file}"
            printf 'GOHUB_OAUTH_CLIENT_SECRET=%s\\n' "${GOHUB_OAUTH_CLIENT_SECRET}" >> "${secrets_file}"
            printf 'GOHUB_OAUTH_REDIRECT_URI=%s\\n' "${GOHUB_OAUTH_REDIRECT_URI}" >> "${secrets_file}"
          else
            echo "GO Hub OAuth secrets are incomplete; MCP will remain fail-closed."
          fi
          if [ -s "${secrets_file}" ]; then
            npx wrangler deploy --config wrangler.go-hub.jsonc --secrets-file "${secrets_file}"
          else
            npx wrangler deploy --config wrangler.go-hub.jsonc
          fi
