name: GO Hub Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOHUB_GITHUB_TOKEN: ${{ secrets.GOHUB_GITHUB_TOKEN }}
      GOHUB_MASTER_KEY: ${{ secrets.GOHUB_MASTER_KEY }}
      GOHUB_OWNER_PASSCODE: ${{ secrets.GOHUB_OWNER_PASSCODE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight Cloudflare Google Drive bindings
        shell: bash
        run: |
          settings_file="${RUNNER_TEMP}/go-hub-drive-settings.json"
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/go-hub/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            > "${settings_file}"
          node - "${settings_file}" <<'NODE'
          const fs = require("node:fs");

          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const bindings = payload?.result?.bindings || [];
          const byName = new Map(bindings.map(binding => [binding.name, binding.type]));
          const aliases = {
            access: ["GOOGLE_DRIVE_ACCESS_TOKEN", "DRIVE_ACCESS_TOKEN", "GDRIVE_ACCESS_TOKEN", "GOOGLE_ACCESS_TOKEN", "GOOGLE_OAUTH_ACCESS_TOKEN", "GDRIVE_OAUTH_ACCESS_TOKEN"],
            refresh: ["GOOGLE_DRIVE_REFRESH_TOKEN", "DRIVE_REFRESH_TOKEN", "GDRIVE_REFRESH_TOKEN", "GOOGLE_REFRESH_TOKEN", "GOOGLE_OAUTH_REFRESH_TOKEN", "GDRIVE_OAUTH_REFRESH_TOKEN"],
            clientId: ["GOOGLE_DRIVE_CLIENT_ID", "DRIVE_CLIENT_ID", "GDRIVE_CLIENT_ID", "GOOGLE_CLIENT_ID", "GOOGLE_OAUTH_CLIENT_ID", "GDRIVE_OAUTH_CLIENT_ID"],
            clientSecret: ["GOOGLE_DRIVE_CLIENT_SECRET", "DRIVE_CLIENT_SECRET", "GDRIVE_CLIENT_SECRET", "GOOGLE_CLIENT_SECRET", "GOOGLE_OAUTH_CLIENT_SECRET", "GDRIVE_OAUTH_CLIENT_SECRET"],
            root: ["GOOGLE_DRIVE_ROOT_FOLDER_ID", "DRIVE_ROOT_FOLDER_ID", "GDRIVE_ROOT_FOLDER_ID", "GOOGLE_DRIVE_FOLDER_ID", "DRIVE_FOLDER_ID", "GDRIVE_FOLDER_ID", "GOOGLE_ROOT_FOLDER_ID"],
          };
          const first = (names, types) => names.find(name => types.includes(byName.get(name)));
          const access = first(aliases.access, ["secret_text"]);
          const refresh = first(aliases.refresh, ["secret_text"]);
          const clientId = first(aliases.clientId, ["plain_text", "secret_text"]);
          const clientSecret = first(aliases.clientSecret, ["secret_text"]);
          const root = first(aliases.root, ["plain_text", "secret_text"]);
          const authReady = Boolean(access || (refresh && clientId && clientSecret));

          if (!authReady) {
            const candidates = bindings
              .filter(binding => /drive|google/i.test(String(binding.name || "")))
              .map(binding => `${binding.name}(${binding.type})`);
            console.error("::error::GO Hub Google Drive auth bindings are missing or use unsupported names/types.");
            console.error("::error::Expected either ACCESS_TOKEN secret or REFRESH_TOKEN + CLIENT_ID + CLIENT_SECRET.");
            console.error(`::error::Drive/Google-like bindings currently visible: ${candidates.join(", ") || "none"}`);
            process.exit(1);
          }

          console.log(`Cloudflare Google Drive preflight passed using ${access ? "access-token" : "refresh-token"} auth.`);
          console.log(`Root-folder scope binding: ${root ? root + "(" + byName.get(root) + ")" : "not configured (optional)"}.`);
          NODE

      - name: Verify GO Hub safety gate
        run: npm run deploy:gate

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preflight Cloudflare Linear bindings
        shell: bash
        run: |
          settings_file="${RUNNER_TEMP}/go-hub-settings.json"
          scripts_file="${RUNNER_TEMP}/workers-scripts.json"
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/go-hub/settings" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            > "${settings_file}"
          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            > "${scripts_file}"
          node - "${settings_file}" "${scripts_file}" <<'NODE'
          const fs = require("node:fs");

          (async () => {
            const settings = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const scripts = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
            const bindings = settings?.result?.bindings || [];
            const byName = new Map(bindings.map(binding => [binding.name, binding.type]));
            const apiSecretNames = ["LINEAR_API_KEY", "linear-API"];
            const apiSecretName = apiSecretNames.find(name => byName.get(name) === "secret_text");
            const teamKeyType = byName.get("LINEAR_TEAM_KEY");
            const missing = [];
            if (!apiSecretName) {
              console.error("::error::Cloudflare binding missing or wrong type: LINEAR_API_KEY or linear-API expected secret_text, got MISSING");
              missing.push("LINEAR_API_KEY or linear-API");
            }
            if (teamKeyType !== "plain_text") {
              console.error(`::error::Cloudflare binding missing or wrong type: LINEAR_TEAM_KEY expected plain_text, got ${teamKeyType || "MISSING"}`);
              missing.push("LINEAR_TEAM_KEY");
            }
            if (!missing.length) {
              console.log(`Cloudflare Linear binding preflight passed using API secret binding ${apiSecretName}.`);
              return;
            }

            console.error("::error::Locate misplaced Linear bindings across Cloudflare Workers.");
            let candidates = 0;
            const trackedNames = new Set([...apiSecretNames, "LINEAR_TEAM_KEY"]);
            const workerNames = (scripts?.result || []).map(worker => worker.id).filter(Boolean);
            for (const workerName of workerNames) {
              if (workerName === "go-hub") continue;
              const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${encodeURIComponent(workerName)}/settings`;
              const response = await fetch(url, {
                headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              });
              if (!response.ok) continue;
              const payload = await response.json();
              const matches = (payload?.result?.bindings || []).filter(binding => trackedNames.has(binding.name));
              if (!matches.length) continue;
              candidates += 1;
              console.error(`::error::candidate Worker ${workerName}: ${matches.map(binding => `${binding.name}(${binding.type})`).join(", ")}`);
            }
            if (!candidates) console.error("::error::No candidate Worker contains LINEAR_API_KEY, linear-API, or LINEAR_TEAM_KEY bindings.");
            process.exit(1);
          })().catch(error => {
            console.error(`::error::Cloudflare binding locator failed: ${error?.message || "unknown error"}`);
            process.exit(1);
          });
          NODE

      - name: Deploy GO Hub Worker
        shell: bash
        run: |
          secrets_file="${RUNNER_TEMP}/go-hub.secrets"
          : > "${secrets_file}"
          chmod 600 "${secrets_file}"
          if [ -n "${GOHUB_GITHUB_TOKEN}" ]; then
            printf 'GITHUB_TOKEN=%s\n' "${GOHUB_GITHUB_TOKEN}" >> "${secrets_file}"
          fi
          if [ -n "${GOHUB_MASTER_KEY}" ] && [ -n "${GOHUB_OWNER_PASSCODE}" ]; then
            printf 'GOHUB_MASTER_KEY=%s\n' "${GOHUB_MASTER_KEY}" >> "${secrets_file}"
            printf 'GOHUB_OWNER_PASSCODE=%s\n' "${GOHUB_OWNER_PASSCODE}" >> "${secrets_file}"
          else
            echo "GO Hub OAuth secrets are incomplete; MCP will remain fail-closed."
          fi
          if [ -s "${secrets_file}" ]; then
            npx wrangler deploy --config wrangler.go-hub.jsonc --secrets-file "${secrets_file}"
          else
            npx wrangler deploy --config wrangler.go-hub.jsonc
          fi

      - name: Verify deployed Google Drive runtime through MCP
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createTestAccessToken } from "./go-hub-oauth.mjs";

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const cloudflareToken = process.env.CLOUDFLARE_API_TOKEN;
          const signingKey = process.env.GOHUB_MASTER_KEY;
          if (!accountId || !cloudflareToken || !signingKey) {
            console.error("::error::Drive runtime smoke prerequisites are missing.");
            process.exit(1);
          }

          const subdomainUrl = "https://api.cloudflare.com/client/v4/accounts/" + accountId + "/workers/subdomain";
          const subdomainResponse = await fetch(subdomainUrl, {
            headers: { authorization: "Bearer " + cloudflareToken },
          });
          const subdomainPayload = await subdomainResponse.json().catch(() => null);
          const subdomain = String(subdomainPayload?.result?.subdomain || "").trim();
          if (!subdomainResponse.ok || !subdomain) {
            console.error("::error::Unable to resolve Cloudflare workers.dev subdomain for runtime smoke.");
            process.exit(1);
          }

          const origin = "https://go-hub." + subdomain + ".workers.dev";
          const accessToken = await createTestAccessToken({ issuer: origin, signingKey });
          const response = await fetch(origin + "/mcp", {
            method: "POST",
            headers: {
              authorization: "Bearer " + accessToken,
              "content-type": "application/json",
              accept: "application/json, text/event-stream",
            },
            body: JSON.stringify({
              jsonrpc: "2.0",
              id: 1,
              method: "tools/call",
              params: { name: "go_hub_drive_health", arguments: {} },
            }),
          });
          const payload = await response.json().catch(() => null);
          const toolResult = payload?.result;
          const proof = toolResult?.structuredContent;
          if (!response.ok || payload?.error || toolResult?.isError || proof?.ok !== true || proof?.upstream !== "PASS") {
            const code = proof?.code || payload?.error?.message || "DRIVE_RUNTIME_HEALTH_FAILED";
            console.error("::error::GO Hub Google Drive runtime MCP health failed: " + code);
            process.exit(1);
          }
          console.log("GO Hub Google Drive runtime MCP health passed (" + (proof.authMode || "configured") + ").");
          NODE


      - name: Verify deployed LIGHT MCP runtime
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createAccessToken } from "./go-hub-oauth.mjs";

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const cloudflareToken = process.env.CLOUDFLARE_API_TOKEN;
          const signingKey = process.env.GOHUB_MASTER_KEY;
          if (!accountId || !cloudflareToken || !signingKey) {
            console.error("::error::LIGHT MCP runtime smoke prerequisites are missing.");
            process.exit(1);
          }

          const subdomainResponse = await fetch(
            "https://api.cloudflare.com/client/v4/accounts/" + accountId + "/workers/subdomain",
            { headers: { authorization: "Bearer " + cloudflareToken } },
          );
          const subdomainPayload = await subdomainResponse.json().catch(() => null);
          const subdomain = String(subdomainPayload?.result?.subdomain || "").trim();
          if (!subdomainResponse.ok || !subdomain) {
            console.error("::error::Unable to resolve Cloudflare workers.dev subdomain for LIGHT MCP smoke.");
            process.exit(1);
          }

          const origin = "https://go-hub." + subdomain + ".workers.dev";
          const token = await createAccessToken({
            issuer: origin,
            signingKey,
            resource: origin + "/mcp/light",
            subject: "light",
            scope: "go-hub-light",
            ttlSeconds: 600,
          });
          const toolsResponse = await fetch(origin + "/mcp/light", {
            method: "POST",
            headers: {
              authorization: "Bearer " + token,
              "content-type": "application/json",
              accept: "application/json, text/event-stream",
              origin: "https://www.notion.so",
            },
            body: JSON.stringify({
              jsonrpc: "2.0",
              id: 1,
              method: "tools/list",
              params: {},
            }),
          });
          const toolsPayload = await toolsResponse.json().catch(() => null);
          const names = (toolsPayload?.result?.tools || []).map(tool => tool?.name).filter(Boolean);
          const required = ["go_hub_read_file", "go_hub_create_branch", "go_hub_put_file", "go_hub_compare_refs", "go_hub_open_pull_request"];
          const forbidden = ["go_hub_delete_file", "go_hub_merge_pull_request", "go_hub_centre_live_action"];
          const missing = required.filter(name => !names.includes(name));
          const exposed = forbidden.filter(name => names.includes(name));
          if (!toolsResponse.ok || toolsPayload?.error || missing.length || exposed.length) {
            console.error("::error::LIGHT MCP live tool surface mismatch.");
            if (missing.length) console.error("::error::Missing: " + missing.join(", "));
            if (exposed.length) console.error("::error::Forbidden exposed: " + exposed.join(", "));
            process.exit(1);
          }

          const ownerPage = await fetch(origin + "/hub/light-mcp", { redirect:"manual" });
          const ownerHtml = await ownerPage.text();
          if (!ownerPage.ok || !/GO Hub × LIGHT/.test(ownerHtml) || !/Mint a scoped bearer token for LIGHT/.test(ownerHtml)) {
            console.error("::error::LIGHT MCP owner page live readback failed.");
            process.exit(1);
          }

          console.log("GO Hub LIGHT MCP runtime smoke passed.");
          NODE
