name: NormalPocket Deploy Authority Cutover

on:
  push:
    branches:
      - feat/normalpocket-product-variants
    paths:
      - .github/workflows/normalpocket-build-authority-cutover.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disable-cloudflare-production-promotion:
    name: Keep Cloudflare Builds as versions-only
    runs-on: ubuntu-latest
    steps:
      - name: Disable production promotion in Cloudflare Builds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          scripts="$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          worker_tag="$(printf '%s' "$scripts" | jq -r '.result[] | select(.id == "normalpocket") | .tag' | head -n1)"
          test -n "$worker_tag"
          test "$worker_tag" != "null"

          triggers="$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/workers/${worker_tag}/triggers" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          production_trigger="$(printf '%s' "$triggers" | jq -r '.result[] | select((.branch_includes // []) | index("main")) | .trigger_uuid' | head -n1)"
          test -n "$production_trigger"
          test "$production_trigger" != "null"

          curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/triggers/${production_trigger}" \
            --request PATCH \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"deploy_command":"npx wrangler versions upload"}' >/dev/null

          verified="$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/workers/${worker_tag}/triggers" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          deploy_command="$(printf '%s' "$verified" | jq -r --arg uuid "$production_trigger" '.result[] | select(.trigger_uuid == $uuid) | .deploy_command')"
          test "$deploy_command" = "npx wrangler versions upload"
          printf 'Verified normalpocket main trigger: %s\n' "$deploy_command"
