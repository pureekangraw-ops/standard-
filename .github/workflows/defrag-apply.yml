name: Temporary STANDARD Defrag Apply

on:
  push:
    branches:
      - defrag/standard-upstream-sync

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[defrag-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out defrag branch
        uses: actions/checkout@v4
        with:
          ref: defrag/standard-upstream-sync
      - name: Apply asserted transforms
        run: python3 scripts/apply-defrag-upstream-sync.py
      - name: Verify patch shape
        run: git diff --check
      - name: Commit transformed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html metropolis-v4.js metropolis-r5.js metropolis-r5-2.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "refactor: apply verified STANDARD defrag transforms [defrag-applied]"
          git push origin HEAD:defrag/standard-upstream-sync
