name: Build GO Sidecar v0.1

on:
  push:
    branches: ["go-sidecar-v01-build"]
    paths:
      - "go-sidecar-v01/**"
      - ".github/workflows/go-sidecar-v01.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-sidecar-v01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GO-Sidecar-v0.1-debug-apk
          path: go-sidecar-v01/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
