name: STANDARD Safety Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  safety-gate:
    name: STANDARD regression safety gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deploy gate
        run: npm run deploy:gate

  diagnose-tests:
    name: DIAG tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  diagnose-syntax:
    name: DIAG syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:syntax

  diagnose-utf8:
    name: DIAG utf8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:utf8

  diagnose-no-ride:
    name: DIAG no-ride
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:no-ride
