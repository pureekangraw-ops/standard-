name: STANDARD Safety Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  safety-gate:
    name: STANDARD regression safety gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests A-F
        run: node --test tests/[a-fA-F]*.test.cjs
      - name: Run GO Hub tests A-F
        run: node --test tests/go-hub-[a-fA-F]*.test.cjs
      - name: Run GO Hub tests G-M
        run: node --test tests/go-hub-[g-mG-M]*.test.cjs
      - name: Run GO Hub tests N-Z
        run: node --test tests/go-hub-[n-zN-Z]*.test.cjs
      - name: Run other G tests
        run: node --test tests/go-browser*.test.cjs tests/go-light*.test.cjs
      - name: Run tests H-M
        run: node --test tests/[h-mH-M]*.test.cjs
      - name: Run tests N-Z
        run: node --test tests/[n-zN-Z]*.test.cjs
      - name: Check syntax
        run: npm run check:syntax
      - name: Check UTF-8
        run: npm run check:utf8
      - name: Check no-RIDE
        run: npm run check:no-ride
      - name: Build unsigned GO Browser review artifact
        run: npm run build:go-browser-extension
      - name: Upload unsigned GO Browser review artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-browser-local-v1-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/go-browser-local-v1
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned GO Browser Observer review artifact
        run: npm run build:go-browser-observer-extension
      - name: Upload unsigned GO Browser Observer review artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-browser-local-observer-v1-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/go-browser-local-observer-v1
          if-no-files-found: error
          retention-days: 7
