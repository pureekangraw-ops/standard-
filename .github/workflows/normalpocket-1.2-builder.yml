name: NormalPocket 1.2 Builder

on:
  push:
    branches:
      - feat/normalpocket-1.2-simple-shop-flow
    paths:
      - scripts/apply-normalpocket-1.2.mjs
      - .github/workflows/normalpocket-1.2-builder.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/normalpocket-1.2-simple-shop-flow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply NormalPocket 1.2 changes
        run: node scripts/apply-normalpocket-1.2.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: implement NormalPocket 1.2 simple shop flow"
          git push origin HEAD:feat/normalpocket-1.2-simple-shop-flow
