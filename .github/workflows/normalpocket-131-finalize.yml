name: NormalPocket 1.3.1 Finalize
on:
  push:
    branches: [fix/normalpocket-1.3.1-mobile-polish]
    paths: [.github/workflows/normalpocket-131-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/normalpocket-1.3.1-mobile-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 1.3.1 mobile polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {text.count(old)}")
              return text.replace(old, new, 1)

          path = Path('normalpocket-simple-flow.js')
          s = path.read_text()
          s = replace_once(s, 'const VERSION = "1.3.0";', 'const VERSION = "1.3.1";', 'flow version')
          s = replace_once(s, '? { empty: true, message: "ยังไม่มีสินค้า เพิ่มสินค้าแรกหรือใช้ขายด่วนได้ทันที" }', '? { empty: true, message: "ยังไม่มีสินค้า เพิ่มสินค้าแรกได้เลย" }', 'first-run copy')
          marker = '''  function upsertDayCloseEvent(existing, summary, { id, at } = {}) {'''
          helper = '''  function shouldShowTodaySummary({ productCount = 0, sales = 0, cash = 0, stock = 0, tasks = 0 } = {}) {\n    return Number(productCount || 0) > 0 || Number(sales || 0) != 0 || Number(cash || 0) != 0 || Number(stock || 0) != 0 || Number(tasks || 0) > 0;\n  }\n\n'''
          if helper not in s:
              s = replace_once(s, marker, helper + marker, 'summary helper insertion')
          s = replace_once(s,
              'const api = Object.freeze({ VERSION, STOCK_ADJUST_REASONS, firstRunHint, upsertDayCloseEvent, buildQuickSale, daySummary, stockAdjustmentDelta });',
              'const api = Object.freeze({ VERSION, STOCK_ADJUST_REASONS, firstRunHint, shouldShowTodaySummary, upsertDayCloseEvent, buildQuickSale, daySummary, stockAdjustmentDelta });',
              'api export')
          s = replace_once(s,
              '<div class="np-first-run" id="npFirstRun" hidden><span id="npFirstRunText"></span><div><button type="button" data-np-first="add">เพิ่มสินค้าแรก</button><button type="button" data-np-first="quick">ขายด่วน</button></div></div>',
              '<div class="np-first-run" id="npFirstRun" hidden><span id="npFirstRunText"></span><div><button type="button" data-np-first="add">เพิ่มสินค้าแรก</button></div></div>',
              'first-run markup')
          s = replace_once(s, '<small>ราคา + จำนวน + รับเงิน</small>', '<small>ราคา · จำนวน · รับเงิน</small>', 'quick helper')
          s = replace_once(s, '<div class="np-today-strip">', '<div class="np-today-strip" id="npTodayStrip">', 'today strip id')
          s = replace_once(s, '      panel.querySelector(\'[data-np-first="quick"]\').onclick = openQuickSale;\n', '', 'duplicate quick binding')
          visibility_marker = '''    if (hintText) hintText.textContent = hint.message;\n    const set = (id, text) => { const node = document.getElementById(id); if (node) node.textContent = text; };'''
          visibility_new = '''    if (hintText) hintText.textContent = hint.message;\n    const summaryVisible = shouldShowTodaySummary(metrics);\n    const npTodayStrip = document.getElementById("npTodayStrip");\n    if (npTodayStrip) npTodayStrip.hidden = !summaryVisible;\n    const set = (id, text) => { const node = document.getElementById(id); if (node) node.textContent = text; };'''
          s = replace_once(s, visibility_marker, visibility_new, 'summary visibility')
          path.write_text(s)

          css_path = Path('normalpocket-simple-flow.css')
          css = css_path.read_text()
          css = replace_once(css,
              '.np-action small{color:var(--muted,#677);line-height:1.3}',
              '.np-action small{color:var(--muted,#677);line-height:1.3;white-space:nowrap}',
              'quick helper nowrap')
          css_path.write_text(css)

          version_files = [
              Path('index.html'), Path('package.json'), Path('RELEASE_MANIFEST.json'),
              Path('sw.js'), Path('README_TH.md'), Path('UPLOAD_GUIDE.md')
          ] + sorted(Path('tests').glob('*.test.cjs'))
          for p in version_files:
              text = p.read_text()
              text = text.replace('v1.3.0-20260812-r5-one-hand-mobile', 'v1.3.1-20260812-r6-mobile-polish')
              text = text.replace('1.3.0-one-hand-mobile', '1.3.1-mobile-polish')
              text = text.replace('1.3.0', '1.3.1')
              text = text.replace(r'1\.3\.0', r'1\.3\.1')
              p.write_text(text)

          manifest = Path('RELEASE_MANIFEST.json')
          text = manifest.read_text()
          text = text.replace('"first-run catalog guidance without blocking quick sale",', '"compact first-run catalog guidance without duplicated quick-sale action",\n    "empty-shop summary suppression",')
          text = text.replace('NormalPocket 1.3.1 makes the 1.2 daily shop flow faster to scan and easier to operate one-handed on mobile while preserving encrypted local Store/Ledger/Calendar data ownership.', 'NormalPocket 1.3.1 polishes the one-hand mobile home by removing duplicated first-run actions and hiding zero-value summary cards while the shop is empty, preserving encrypted local Store/Ledger/Calendar data ownership.')
          manifest.write_text(text)
          PY
      - name: Verify GREEN
        run: npm run deploy:gate
      - name: Remove builder and regenerate checksums
        shell: bash
        run: |
          git rm .github/workflows/normalpocket-131-finalize.yml
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          rows = []
          for name in files:
              if not name or name == 'SHA256SUMS.txt':
                  continue
              p = Path(name)
              if not p.exists():
                  continue
              rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {name}")
          Path('SHA256SUMS.txt').write_text('\n'.join(rows) + '\n')
          PY
          sha256sum -c SHA256SUMS.txt
      - name: Commit final tree
        shell: bash
        run: |
          git config user.name "pureekangraw-ops"
          git config user.email "pureekangraw@gmail.com"
          git add -A
          git commit -m "fix: polish NormalPocket 1.3.1 mobile home"
          git push origin HEAD:fix/normalpocket-1.3.1-mobile-polish
