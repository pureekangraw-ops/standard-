name: NormalPocket SHA Finalize

on:
  push:
    branches:
      - feat/normalpocket-1.2-simple-shop-flow
    paths:
      - .github/workflows/normalpocket-sha-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/normalpocket-1.2-simple-shop-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate tracked-file SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/normalpocket-sha-finalize.yml'
          rm -f "$workflow"
          : > SHA256SUMS.txt
          while IFS= read -r file; do
            case "$file" in
              SHA256SUMS.txt|"$workflow") continue ;;
            esac
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done < <(git ls-files | LC_ALL=C sort)
          sha256sum -c SHA256SUMS.txt
      - name: Run full deploy gate
        run: npm run deploy:gate
      - name: Commit checksum manifest and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize NormalPocket 1.2 checksums"
          git push origin HEAD:feat/normalpocket-1.2-simple-shop-flow
