name: Temporary STANDARD No-RIDE Apply

on:
  push:
    branches:
      - defrag/standard-upstream-sync

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ride-removed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out defrag branch
        uses: actions/checkout@v4
        with:
          ref: defrag/standard-upstream-sync
      - name: Remove asserted RIDE runtime contracts
        run: python3 scripts/remove-standard-ride-runtime.py
      - name: Verify patch shape
        run: git diff --check
      - name: Commit no-RIDE runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js highway-gate.js flow-era.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "refactor: remove executable STANDARD RIDE contracts [ride-removed]"
          git push origin HEAD:defrag/standard-upstream-sync
