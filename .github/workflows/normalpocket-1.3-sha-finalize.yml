name: NormalPocket 1.3 SHA Finalize

on:
  push:
    branches:
      - feat/normalpocket-1.3-one-hand-mobile-flow
    paths:
      - .github/workflows/normalpocket-1.3-sha-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/normalpocket-1.3-one-hand-mobile-flow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate tracked-file SHA256 manifest
        run: |
          git ls-files | grep -v '^SHA256SUMS.txt$' | grep -v '^.github/workflows/normalpocket-1.3-sha-finalize.yml$' | while IFS= read -r file; do
            sha256sum "$file"
          done > SHA256SUMS.txt
      - name: Run full deploy gate
        run: npm run deploy:gate
      - name: Commit checksum manifest and remove temporary workflow
        run: |
          rm .github/workflows/normalpocket-1.3-sha-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS.txt
          git add -u .github/workflows/normalpocket-1.3-sha-finalize.yml
          git commit -m "chore: finalize NormalPocket 1.3 checksums"
          git push origin HEAD:feat/normalpocket-1.3-one-hand-mobile-flow
